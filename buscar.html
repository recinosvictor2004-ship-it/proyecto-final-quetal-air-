<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar vuelos</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <header class="header">
        <img src="img/logo.png" class="header-logo">
    </header>

    <main class="menu-wrapper">
        <div class="menu-card">

            <h1 class="menu-title">Buscar vuelos</h1>
            <p class="menu-subtitle">Ingresa los datos para buscar vuelos</p>

            <form class="form" action="resultados.html" method="GET">

                <div class="form-group">
                    <label>Origen</label>
                    <select required>
                        <option value="">Seleccionar...</option>
                        <option>Guatemala</option>
                        <option>El Salvador</option>
                        <option>Panamá</option>
                        <option>Costa Rica</option>
                        <option>México</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Destino</label>
                    <select required>
                        <option value="">Seleccionar...</option>
                        <option>Guatemala</option>
                        <option>El Salvador</option>
                        <option>Panamá</option>
                        <option>Costa Rica</option>
                        <option>México</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Fecha de salida</label>
                    <input type="date" required>
                </div>

                <div class="form-group">
                    <label>Pasajeros</label>
                    <select required>
                        <option value="">Seleccionar...</option>
                        <option>1 pasajero</option>
                        <option>2 pasajeros</option>
                        <option>3 pasajeros</option>
                        <option>4 pasajeros</option>
                    </select>
                </div>

                <button class="btn menu-btn" type="submit">Buscar vuelos</button>

            </form>

        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Quetzal Air — Todos los derechos reservados</p>
    </footer>

</body>
</html>
