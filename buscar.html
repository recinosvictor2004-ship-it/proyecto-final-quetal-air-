<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal Air - Buscar vuelos</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <div class="page-container">

        <div class="page-header">
            <img src="img/logo.png" class="login-logo">
            <h1>Buscar Vuelos</h1>
            <p class="login-subtitle">Ingresa los datos para buscar vuelos</p>
        </div>

        <div class="card">

            <h2 class="section-title">Formulario de búsqueda</h2>

            <form class="form" action="resultados.html" method="GET">

                <div class="form-2col">
                    <div class="form-group">
                        <label>Origen</label>
                        <select required>
                            <option value="">Seleccionar...</option>
                            <option value="Guatemala">Guatemala</option>
                            <option value="El Salvador">El Salvador</option>
                            <option value="Panamá">Panamá</option>
                            <option value="Costa Rica">Costa Rica</option>
                            <option value="México">México</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Destino</label>
                        <select required>
                            <option value="">Seleccionar...</option>
                            <option value="Guatemala">Guatemala</option>
                            <option value="El Salvador">El Salvador</option>
                            <option value="Panamá">Panamá</option>
                            <option value="Costa Rica">Costa Rica</option>
                            <option value="México">México</option>
                        </select>
                    </div>
                </div>

                <div class="form-2col">
                    <div class="form-group">
                        <label>Fecha de salida</label>
                        <input type="date" required>
                    </div>

                    <div class="form-group">
                        <label>Pasajeros</label>
                        <select required>
                            <option value="">Seleccionar...</option>
                            <option value="1">1 pasajero</option>
                            <option value="2">2 pasajeros</option>
                            <option value="3">3 pasajeros</option>
                            <option value="4">4 pasajeros</option>
                        </select>
                    </div>
                </div>

                <button class="btn" type="submit">Buscar vuelos</button>

            </form>

        </div>

        <div class="nav-buttons">
            <a href="menu.html" class="btn btn-secondary">Regresar</a>
        </div>

    </div>

</body>
</html>
