<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal Air - Buscar Vuelos</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS RESPONSIVE -->
    <link rel="stylesheet" href="css/responsive.css">

    <!-- CSS LAYOUT -->
    <link rel="stylesheet" href="css/layout.css">

    <!-- CSS FORMS -->
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <div class="page-container">

        <!-- Encabezado -->
        <div class="page-header">
            <img src="img/logo.png" alt="Quetzal Air" class="login-logo">
            <h1>Buscar Vuelos</h1>
            <p class="login-subtitle">Encuentra vuelos disponibles según tu destino</p>
        </div>

        <!-- Tarjeta del formulario -->
        <div class="card">

            <h2 class="section-title">Formulario de búsqueda</h2>

            <form class="form">

                <div class="form-2col">

                    <div class="form-group">
                        <label>Origen</label>
                        <select required>
                            <option value="">Seleccionar...</option>
                            <option>Guatemala</option>
                            <option>El Salvador</option>
                            <option>Panamá</option>
                            <option>Costa Rica</option>
                            <option>México</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Destino</label>
                        <select required>
                            <option value="">Seleccionar...</option>
                            <option>Guatemala</option>
                            <option>El Salvador</option>
                            <option>Panamá</option>
                            <option>Costa Rica</option>
                            <option>México</option>
                        </select>
                    </div>

                </div>

                <div class="form-2col">

                    <div class="form-group">
                        <label>Fecha de salida</label>
                        <input type="date" required>
                    </div>

                    <div class="form-group">
                        <label>Pasajeros</label>
                        <select required>
                            <option value="">Seleccionar...</option>
                            <option>1 pasajero</option>
                            <option>2 pasajeros</option>
                            <option>3 pasajeros</option>
                            <option>4 pasajeros</option>
                        </select>
                    </div>

                </div>

                <button class="btn" type="submit">Buscar vuelos</button>

            </form>

        </div>

        <!-- Resultados -->
        <div class="card">

            <h2 class="section-title">Resultados</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Precio</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>QA102</td>
                            <td>Guatemala</td>
                            <td>El Salvador</td>
                            <td>12/06/2026</td>
                            <td>08:30 AM</td>
                            <td>Q 850</td>
                        </tr>

                        <tr>
                            <td>QA330</td>
                            <td>Guatemala</td>
                            <td>Costa Rica</td>
                            <td>15/06/2026</td>
                            <td>02:45 PM</td>
                            <td>Q 1,250</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Botones -->
            <div class="nav-buttons">
                <a href="menu.html" class="btn btn-secondary">Regresar</a>
                <a href="loader.html" class="btn">Continuar</a>
            </div>

        </div>

    </div>

</body>
</html>
