<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal Air - Confirmación</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS LAYOUT -->
    <link rel="stylesheet" href="css/layout.css">

    <!-- CSS LOGIN PREMIUM -->
    <link rel="stylesheet" href="css/login-new.css">

    <!-- CSS RESPONSIVE -->
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="login-card" style="max-width: 420px;">

        <!-- Icono de éxito -->
        <div class="login-icon" style="background: var(--verde-quetzal); font-size: 38px;">
            ✓
        </div>

        <!-- Logo -->
        <img src="img/logo.png" alt="Quetzal Air" class="login-logo">

        <!-- Mensaje -->
        <h1 class="login-title">¡Operación exitosa!</h1>
        <p class="login-subtitle">Tu proceso ha sido completado correctamente.</p>

        <!-- Botones -->
        <div class="form" style="margin-top: 2rem;">
            <a href="menu.html" class="login-btn" style="text-align:center;">Volver al menú</a>
            <a href="index.html" class="login-btn" style="background: transparent; border: 2px solid var(--dorado); color: var(--dorado); margin-top: 10px; text-align:center;">
                Cerrar sesión
            </a>
        </div>

    </div>

</body>
</html>
