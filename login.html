<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal Air - Login</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS LOGIN NUEVO -->
    <link rel="stylesheet" href="css/login-new.css">
</head>
<body>

    <div class="login-card">

        <!-- Icono superior -->
        <div class="login-icon">👤</div>

        <!-- Logo -->
        <img src="img/logo.png" alt="Quetzal Air" class="login-logo">

        <!-- Títulos -->
        <h1 class="login-title">Bienvenido</h1>
        <p class="login-subtitle">Inicia sesión para continuar</p>

        <!-- Formulario -->
        <form action="loader.html" method="GET">

            <div class="input-group">
                <input type="email" placeholder="Correo electrónico" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Contraseña" required>
            </div>

            <button class="login-btn" type="submit">Iniciar sesión</button>

        </form>

        <!-- Enlaces -->
        <div class="login-links">
            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            <a href="index.html">Volver al inicio</a>
        </div>

    </div>

</body>
</html>
