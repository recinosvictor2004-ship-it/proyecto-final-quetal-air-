<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS LAYOUT -->
    <link rel="stylesheet" href="css/layout.css">

    <!-- CSS FORMULARIOS -->
    <link rel="stylesheet" href="css/forms.css">

    <!-- CSS RESPONSIVE -->
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <img src="img/logo.png" class="header-logo" alt="Quetzal Air">
    </header>

    <!-- CONTENIDO -->
    <main class="menu-wrapper">
        <div class="menu-card">

            <h1 class="menu-title">Pago</h1>
            <p class="menu-subtitle">Completa tu información de pago</p>

            <form class="form">

                <div class="form-group">
                    <label for="nombre">Nombre en la tarjeta</label>
                    <input id="nombre" type="text" placeholder="Ejemplo: Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="tarjeta">Número de tarjeta</label>
                    <input id="tarjeta" type="text" placeholder="XXXX XXXX XXXX XXXX" maxlength="16" required>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de expiración</label>
                    <input id="fecha" type="month" required>
                </div>

                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input id="cvv" type="text" placeholder="123" maxlength="3" required>
                </div>

            </form>

            <!-- BOTÓN QUE ACTIVA EL MODAL -->
            <label for="modalPago" class="btn menu-btn">Pagar</label>

        </div>
    </main>

    <!-- CHECKBOX CONTROL DEL MODAL -->
    <input type="checkbox" id="modalPago" hidden>

    <!-- MODAL UNIVERSAL -->
    <div class="modal-pago">
        <div class="modal-content">

            <!-- Vista 1: Procesando -->
            <div class="vista-procesando">
                <div class="loader-circle"></div>
                <p>Procesando...</p>
            </div>

            <!-- Vista 2: Completado -->
            <div class="vista-completado">
                <h2>Pago completado</h2>
                <a href="menu.html" class="btn menu-btn">Regresar al menú</a>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Quetzal Air — Todos los derechos reservados</p>
    </footer>

</body>
</html>
