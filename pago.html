<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <header class="header">
        <img src="img/logo.png" class="header-logo">
    </header>

    <main class="menu-wrapper">
        <div class="menu-card">

            <h1 class="menu-title">Pago</h1>
            <p class="menu-subtitle">Completa tu información de pago</p>

            <form class="form">

                <div class="form-group">
                    <label>Nombre en la tarjeta</label>
                    <input type="text" required>
                </div>

                <div class="form-group">
                    <label>Número de tarjeta</label>
                    <input type="text" maxlength="16" required>
                </div>

                <div class="form-2col">
                    <div class="form-group">
                        <label>Expiración</label>
                        <input type="month" required>
                    </div>

                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" maxlength="3" required>
                    </div>
                </div>

                <button class="btn menu-btn">Pagar</button>

            </form>

        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Quetzal Air — Todos los derechos reservados</p>
    </footer>

</body>
</html>
