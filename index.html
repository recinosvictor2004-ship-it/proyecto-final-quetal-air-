<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal Air</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS RESPONSIVE -->
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        /* Fondo con imagen */
        body {
            background: url('img/fondo-avion.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Franja superior con color */
        .top-color-bar {
            width: 100%;
            padding: 25px 0;
            background: var(--azul-celeste); /* puedes cambiar a var(--verde-quetzal) */
            text-align: center;
        }

        /* Logo especial para el index */
        .index-logo {
            width: 140px;
            height: auto;
        }

        /* Contenedor glass */
        .welcome-container {
            max-width: 600px;
            padding: 3rem;
            background: var(--glass);
            border: 1px solid var(--glass-borde);
            border-radius: var(--radius);
            box-shadow: var(--sombra);
            backdrop-filter: blur(14px);
            margin: 4rem auto;
            text-align: center;
        }

        .welcome-title {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .welcome-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <!-- FRANJA SUPERIOR CON COLOR -->
    <div class="top-color-bar">
        <img src="img/logo.png" alt="Quetzal Air" class="index-logo">
    </div>

    <!-- CONTENEDOR GLASS -->
    <div class="welcome-container">

        <h1 class="welcome-title">Bienvenido a Quetzal Air</h1>
        <p class="welcome-subtitle">Tu viaje comienza con nosotros</p>

        <a href="login.html" class="btn" style="font-size: 1.2rem; padding: 14px;">Iniciar sesión</a>

    </div>

</body>
</html>
