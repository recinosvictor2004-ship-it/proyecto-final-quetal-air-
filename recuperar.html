<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal Air - Recuperar contraseña</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS RESPONSIVE -->
    <link rel="stylesheet" href="css/responsive.css">

    <!-- CSS LAYOUT -->
    <link rel="stylesheet" href="css/layout.css">

    <!-- CSS FORMS -->
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <div class="glass-container">

        <!-- Logo -->
        <img src="img/logo.png" alt="Quetzal Air" class="login-logo">

        <!-- Títulos -->
        <h1 class="login-title">Recuperar contraseña</h1>
        <p class="login-subtitle">Ingresa el correo asociado a tu cuenta</p>

        <!-- Formulario -->
        <form class="form" action="loader.html" method="GET">

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" placeholder="ejemplo@correo.com" required>
            </div>

            <button class="btn" type="submit">Enviar enlace de recuperación</button>

        </form>

        <!-- Enlaces -->
        <div class="login-links">
            <a href="login.html">Volver al login</a>
        </div>

    </div>

</body>
</html>
