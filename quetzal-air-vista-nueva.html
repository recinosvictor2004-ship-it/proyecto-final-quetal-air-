     ============================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal Air - Vista Nueva</title>

    <!-- ESTILOS GENERALES -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">

    <!-- ESTILO DE ESTA VISTA -->
    <link rel="stylesheet" href="css/quetzal-air-vista-nueva.css">
</head>

<body>

    <div class="vista-nueva-wrapper">

        <!-- Fondo decorativo -->
        <div class="vista-nueva-circle"></div>
        <div class="vista-nueva-mountains"></div>

        <!-- LOGO -->
        <img src="img/logo.png" alt="Quetzal Air" class="vista-nueva-logo">

        <!-- CARD PRINCIPAL -->
        <div class="vista-nueva-card">

            <h1 class="vista-nueva-title">Nueva Vista Quetzal Air</h1>
            <p class="vista-nueva-subtitle">
                Esta es una nueva sección integrada al diseño oficial de Quetzal Air
            </p>

            <!-- BENEFICIOS -->
            <div class="vista-nueva-benefits">

                <!-- BENEFICIO 1 -->
                <div class="vista-nueva-card-benefit">
                    <div class="vista-nueva-icon">✈️</div>
                    <h2>Beneficio 1</h2>
                    <p>Descripción del beneficio número uno.</p>
                </div>

                <!-- BENEFICIO 2 -->
                <div class="vista-nueva-card-benefit">
                    <div class="vista-nueva-icon">💼</div>
                    <h2>Beneficio 2</h2>
                    <p>Descripción del beneficio número dos.</p>
                </div>

                <!-- BENEFICIO 3 -->
                <div class="vista-nueva-card-benefit">
                    <div class="vista-nueva-icon">⭐</div>
                    <h2>Beneficio 3</h2>
                    <p>Descripción del beneficio número tres.</p>
                </div>

            </div>

            <!-- BOTÓN -->
            <div class="vista-nueva-register">
                <a href="index.html" class="vista-nueva-btn">Acción principal</a>
            </div>

        </div>

    </div>

</body>
</html>
