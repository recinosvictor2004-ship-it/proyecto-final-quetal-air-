<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quetzal Air - Check-in</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS RESPONSIVE -->
    <link rel="stylesheet" href="css/responsive.css">

    <!-- CSS LAYOUT -->
    <link rel="stylesheet" href="css/layout.css">

    <!-- CSS FORMS -->
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <div class="page-container">

        <!-- Encabezado -->
        <div class="page-header">
            <img src="img/logo.png" alt="Quetzal Air" class="login-logo">
            <h1>Check-in</h1>
            <p class="login-subtitle">Ingresa tu código de reserva para continuar</p>
        </div>

        <!-- Tarjeta del formulario -->
        <div class="card">

            <h2 class="section-title">Formulario de Check-in</h2>

            <form class="form" action="loader.html" method="GET">

                <div class="form-group">
                    <label for="codigo">Código de reserva</label>
                    <input id="codigo" type="text" placeholder="Ej: QZ1234" required>
                </div>

                <button class="btn" type="submit">Buscar reserva</button>

            </form>

        </div>

        <!-- Botones -->
        <div class="card">

            <h2 class="section-title">Acciones</h2>

            <div class="nav-buttons">
                <a href="menu.html" class="btn btn-secondary">Regresar</a>
                <a href="loader.html" class="btn">Continuar</a>
            </div>

        </div>

    </div>

</body>
</html>
