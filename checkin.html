<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>

    <header class="header">
        <img src="img/logo.png" class="header-logo">
    </header>

    <main class="menu-wrapper">
        <div class="menu-card">

            <h1 class="menu-title">Check-in</h1>
            <p class="menu-subtitle">Ingresa tu código de vuelo</p>

            <form class="form">
                <div class="form-group">
                    <label>Código de vuelo</label>
                    <input type="text" required>
                </div>

                <button class="btn menu-btn">Realizar check-in</button>
            </form>

        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Quetzal Air — Todos los derechos reservados</p>
    </footer>

</body>
</html>
